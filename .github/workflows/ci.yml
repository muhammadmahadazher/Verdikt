name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: ruff check verdikt tests
      - name: test
        run: pytest -q --cov=verdikt --cov-report=xml
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: smoke test the CLI on the committed fixture
        shell: bash
        run: |
          verdikt --version
          verdikt ingest "tests/fixtures/adapters/lerobot_eval/*.json" --out /tmp/r.parquet
          verdikt compare "tests/fixtures/adapters/lerobot_eval/*.json" --baseline better || \
            test $? -le 3   # any of the four verdict states is a valid outcome
          verdikt doctor --fail-on never
